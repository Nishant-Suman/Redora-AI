[project]
name = "text-voice-ai"
version = "2.0.0"
description = "Advanced Scanned PDF Voice Reader AI with Computer Vision Preprocessing, Multi-Engine OCR, NLP Cleaning, and Neural TTS"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "R.M.Nishant Suman", email = "rmnishantsuman@gmail.com" }
]
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=5.0.0",
    "streamlit>=1.40.0",
    "pymupdf>=1.24.0",
    "opencv-python>=4.10.0",
    "pillow>=10.0.0",
    "easyocr>=1.7.0",
    "edge-tts>=7.2.0",
    "gtts>=2.5.0",
    "pyttsx3>=2.90",
    "soundfile>=0.13.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "nest-asyncio>=1.6.0",
    "gunicorn>=26.2.0",
]

[tool.uv]
package = false
